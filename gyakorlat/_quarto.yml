project:
  type: book
  output-dir: _book
  pre-render: ../_shared/scripts/prepare.py
  post-render: ../_shared/scripts/postrender.py
  resources:
    - sablonok/*.xlsx
    - notebookok/*.ipynb

book:
  title: "Rendszermérnöki eszköztár"
  subtitle: "Gyakorlati útmutató a V-modell lépéseihez"
  author: "Abonyi János"
  date: "2026"
  date-format: "YYYY"
  output-file: rendszermernokseg-gyakorlat
  site-url: https://complexsystemsintelligence.github.io/rendszermernokseg/gyakorlat/
  repo-url: https://github.com/ComplexSystemsIntelligence/rendszermernokseg
  repo-subdir: gyakorlat
  repo-actions: [edit, issue, source]
  downloads: [pdf, epub]
  search: true
  favicon: assets/logo/favicon-64.png
  cover-image: assets/borito.png
  cover-image-alt: "A kötet borítója a Pannon Egyetem címerével és névjelével"
  # Közös sorozatsáv: cím → a könyv nyitóoldala, a két kötet, jobbra a sorozat főoldala
  navbar:
    title: "Rendszermérnöki ismeretek és módszerek"
    logo-href: https://complexsystemsintelligence.github.io/rendszermernokseg/
    left:
      - text: "Kézikönyv"
        href: https://complexsystemsintelligence.github.io/rendszermernokseg/kezikonyv/
      - text: "Gyakorlati útmutató"
        href: index.qmd
    right:
      - text: "Összes tankönyv"
        href: https://complexsystemsintelligence.github.io/#textbooks
  sidebar:
    style: docked
    collapse-level: 1
    logo: assets/logo/PE_cimer_nevjel_fekvo_kek.svg
    logo-alt: "Pannon Egyetem"
    logo-href: https://complexsystemsintelligence.github.io/rendszermernokseg/
  page-navigation: true
  page-footer:
    left: "© 2026 Abonyi János · Pannon Egyetem · CC BY-NC-SA 4.0"
    right: "[Kézikönyv](https://complexsystemsintelligence.github.io/rendszermernokseg/kezikonyv/)"
  chapters:
    - index.qmd
    - 00-projekt.qmd
    - part: "I. rész – Projektindítás"
      chapters:
        - eszkozok/01-v-terv.qmd
        - eszkozok/02-kontextusdiagram.qmd
    - part: "II. rész – A V bal ága"
      chapters:
        - eszkozok/03-erdekelt-azonositas.qmd
        - eszkozok/04-hatalom-erdekeltseg.qmd
        - eszkozok/05-interju.qmd
        - eszkozok/06-kano.qmd
        - eszkozok/07-conops.qmd
        - eszkozok/08-kovetelmeny-iras.qmd
        - eszkozok/09-moe-mop-tpm.qmd
        - eszkozok/10-nyomonkovetes.qmd
        - eszkozok/11-qfd.qmd
        - eszkozok/12-funkciofa.qmd
        - eszkozok/13-n2-dsm.qmd
        - eszkozok/14-morfologiai-doboz.qmd
        - eszkozok/15-triz.qmd
        - eszkozok/16-hat-kalap.qmd
        - eszkozok/17-otletroham.qmd
        - eszkozok/18-pugh.qmd
        - eszkozok/19-trade-study.qmd
        - eszkozok/20-maut.qmd
        - eszkozok/21-ahp.qmd
        - eszkozok/22-pareto-front.qmd
        - eszkozok/23-koltseg-haszon.qmd
        - eszkozok/24-hta.qmd
        - eszkozok/25-funkciomegosztas.qmd
        - eszkozok/26-tlx-sus.qmd
        - eszkozok/27-kockazati-matrix.qmd
        - eszkozok/28-pha.qmd
        - eszkozok/29-fmea.qmd
        - eszkozok/30-rbd.qmd
        - eszkozok/31-hibafa.qmd
        - eszkozok/32-esemenyfa.qmd
        - eszkozok/33-stpa.qmd
        - eszkozok/34-turesek.qmd
        - eszkozok/35-doe.qmd
    - part: "III. rész – A V csúcsa"
      chapters:
        - eszkozok/36-folyamatabra-vsm.qmd
        - eszkozok/37-kapacitas.qmd
        - eszkozok/38-sorkiegyenlites.qmd
        - eszkozok/39-oee.qmd
        - eszkozok/40-bpmn.qmd
        - eszkozok/41-gantt.qmd
        - eszkozok/42-abc.qmd
